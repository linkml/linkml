# Weekly compatibility test against the latest linkml-model metamodel
#
# This workflow downloads the latest metamodel from linkml-model and runs
# the compatibility tests to ensure the linkml toolkit can process it.
# If the metamodel has changed, it opens a PR with the update -- red if the
# toolkit can't handle it yet.
#
# It also checks whether the vendored linkml-model files have drifted from
# upstream main, and opens (or updates) a tracking issue when drift is found.

name: Metamodel Compatibility
env:
  UV_VERSION: "0.11.21"
on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  metamodel-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2.0.2

      - name: Download latest metamodel from linkml-model
        run: make download-metamodel

      - name: Run metamodel compatibility tests
        id: run_tests
        run: |
          mkdir -p temp
          uv run pytest tests/linkml/test_metamodel_compat/ --with-slow -v 2>&1 | tee temp/test_output.txt
        continue-on-error: true

      # Open the PR whether or not the compatibility tests passed: a red PR in the
      # `dependencies` queue gets fixed, an issue gets lost. The compat tests are
      # marked slow, so the PR's own Slow Tests job shows the same failure.
      #
      # create-pull-request rebuilds its branch from main on every run, which would
      # discard fixes already pushed to an open PR, so an open one is left alone.
      - name: Check for an open fixture PR
        id: open_pr
        run: |
          OPEN=$(gh pr list --head update-metamodel-fixtures --state open --json number --jq '.[0].number // empty')
          if [ -n "${OPEN}" ]; then
            echo "Fixture PR #${OPEN} is already open; leaving it alone."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write PR body
        if: steps.open_pr.outputs.proceed == 'true'
        run: |
          {
            if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
              echo "Updates the metamodel test fixtures to the latest linkml-model. The compatibility tests passed with these changes."
            else
              echo "Updates the metamodel test fixtures to the latest linkml-model. **The compatibility tests fail with these changes** (see the workflow run): the toolkit needs updating to handle the new metamodel. Push fixes to this branch."
            fi
            echo
            echo "CI does not start on its own for bot-opened PRs: close and reopen this PR to run it."
            echo
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > temp/pr_body.md

      - name: Create PR with updated metamodel
        if: steps.open_pr.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update metamodel test fixtures from linkml-model"
          title: "Update metamodel test fixtures from linkml-model"
          body-path: temp/pr_body.md
          branch: update-metamodel-fixtures
          delete-branch: true
          labels: metamodel-compat, dependencies

      # Only the soft upstream-main comparison runs here. Scoping to that single test
      # keeps an unrelated failure -- a hard UPSTREAM_SHA mismatch, a collection error --
      # from being reported as upstream drift.
      #
      # pytest exit 1 means "tests failed", i.e. genuine drift. Anything else (2 interrupted,
      # 3 internal error, 4 usage error, or a network blip killing the run) is a broken job,
      # not drift, so it fails loudly instead of filing a misleading issue.
      - name: Check vendored files for drift against upstream main
        id: drift_tests
        if: always()
        run: |
          mkdir -p temp
          set +e
          uv run pytest tests/linkml_runtime/test_linkml_model/test_linkml_files.py \
            -k test_vendored_files_match_upstream_main \
            --with-upstream -v 2>&1 | tee temp/drift_output.txt
          PYTEST_RC=${PIPESTATUS[0]}
          set -e
          case "$PYTEST_RC" in
            0) echo "drifted=false" >> $GITHUB_OUTPUT ;;
            1) echo "drifted=true"  >> $GITHUB_OUTPUT ;;
            *) echo "::error::Drift check did not run cleanly (pytest exit $PYTEST_RC); not reporting drift."
               exit "$PYTEST_RC" ;;
          esac

      - name: Check for existing drift issue
        if: always() && steps.drift_tests.outputs.drifted == 'true'
        id: check_drift_issue
        run: |
          EXISTING_ISSUE=$(gh issue list --label "vendored-model-drift" --state open --json number --jq '.[0].number // empty')
          echo "existing_issue=${EXISTING_ISSUE}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue on drift
        if: always() && steps.drift_tests.outputs.drifted == 'true'
        run: |
          ISSUE_TITLE="Vendored linkml-model files have drifted from upstream main"

          {
            cat <<EOF
          ## Vendored linkml-model Drift Detected

          The vendored linkml-model files in \`packages/linkml_runtime/src/linkml_runtime/linkml_model/\`
          have drifted from the upstream \`main\` branch of [linkml-model](https://github.com/linkml/linkml-model).

          This does not block any PR, but the vendored copies will likely need updating
          **before the next release**. Run \`make update_model\` in \`packages/linkml_runtime/\`
          to re-vendor the files.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Test Output (last 50 lines)
          EOF
            echo '```'
            tail -n 50 temp/drift_output.txt
            echo '```'
          } > temp/drift_issue_body.md

          if [ -n "${{ steps.check_drift_issue.outputs.existing_issue }}" ]; then
            gh issue comment "${{ steps.check_drift_issue.outputs.existing_issue }}" --body-file temp/drift_issue_body.md
          else
            gh issue create \
              --title "${ISSUE_TITLE}" \
              --body-file temp/drift_issue_body.md \
              --label "vendored-model-drift,dependencies"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close drift issue if drift is resolved
        if: always() && steps.drift_tests.outputs.drifted == 'false'
        run: |
          EXISTING_ISSUE=$(gh issue list --label "vendored-model-drift" --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING_ISSUE}" ]; then
            gh issue close "${EXISTING_ISSUE}" \
              --comment "Vendored files are now in sync with upstream main. Closing."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Per-PR CI runs fully offline; this weekly job is where the outside world
      # gets checked instead. Two kinds of reality check, in addition to the
      # drift comparison above:
      #
      # - `upstream` tests assert facts about the outside world (published PURLs
      #   resolve, w3id rewrite rules behave, vendored files match the pinned
      #   upstream commit). A PR cannot break these, so failing them here rather
      #   than in per-PR CI turns an upstream outage from a blocked PR into a
      #   red weekly run.
      # - `network` tests normally run against local stubs. Running them live
      #   here catches *stub drift*: if the real servers change behaviour, the
      #   stubs keep asserting yesterday's reality and only this run notices.
      - name: Run upstream reality checks
        if: always()
        run: |
          uv run pytest tests/ -m upstream --with-upstream \
            -k "not test_vendored_files_match_upstream_main" -v

      # Notebook tests are excluded: their `!uv pip install` cells mutate the
      # venv off the lock (#3581), which is why per-PR CI gives them a dedicated
      # runner. Their stub-mode run in per-PR CI is the coverage that matters.
      # (Cost: URLs only notebooks fetch -- the biocontext monarch context --
      # are not live-checked anywhere; their stubs could drift silently.)
      # --with-slow/--with-biolink: several network-marked tests (the metamodel
      # RDF ones especially -- the original flake source) are also marked slow,
      # and would otherwise be collected but skipped, silently exempting their
      # stubs from this live check.
      - name: Run network-marked tests against the live network
        if: always()
        run: |
          uv run pytest tests/ --ignore=tests/linkml/test_notebooks \
            -m "network and not kroki" --with-network --with-slow --with-biolink -v

  # Nothing moves UPSTREAM_SHA automatically, so a new linkml-model (pre)release
  # can sit unadopted with every check still green. When one exists, re-vendor it
  # and open a PR: merging that PR is the decision to adopt the release. Expect it
  # to arrive red -- generated snapshots usually need regenerating alongside it.
  #
  # A separate job so the fixture changes made above can't leak into this PR.
  vendored-model-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # Resolution is delegated to `make print_latest_model_release`, the same
      # target `make update_model` uses, so this check and the vendoring command
      # cannot disagree about what "latest" means. If it fails, its own error
      # message ends the step and nothing downstream fires.
      - name: Check whether the vendored pin is behind the latest release
        id: pin_check
        run: |
          PINNED=$(tr -d '[:space:]' < packages/linkml_runtime/src/linkml_runtime/linkml_model/UPSTREAM_SHA)
          RELEASE=$(make -C packages/linkml_runtime -s print_latest_model_release)
          read -r TAG LATEST <<< "${RELEASE}"
          if [ -z "${PINNED}" ] || [ -z "${TAG}" ] || [ -z "${LATEST}" ]; then
            echo "::error::Could not resolve the vendored pin or the latest release (pinned='${PINNED}' release='${RELEASE}')"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Compare by ancestry, not equality: a pin ahead of the latest release
          # (re-vendored from main by hand) is not stale, and re-vendoring would
          # downgrade it.
          STATUS=$(gh api "repos/linkml/linkml-model/compare/${PINNED}...${LATEST}" --jq .status)
          case "${STATUS}" in
            identical)
              echo "Vendored pin matches ${TAG}."
              echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            ahead)
              echo "Vendored pin ${PINNED} is behind ${TAG} (${LATEST})."
              echo "stale=true" >> "$GITHUB_OUTPUT" ;;
            behind|diverged)
              echo "::warning::Vendored pin ${PINNED} is not behind ${TAG} (${STATUS}); not re-vendoring."
              echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected compare status '${STATUS}' for ${PINNED}...${LATEST}"
              exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # create-pull-request rebuilds its branch from main on every run, which would
      # discard snapshot fixes already pushed to an open re-vendor PR. Leave an open
      # one alone; a newer release is picked up once it is merged or closed.
      - name: Check for an open re-vendor PR
        if: steps.pin_check.outputs.stale == 'true'
        id: open_pr
        run: |
          OPEN=$(gh pr list --head update-vendored-linkml-model --state open --json number --jq '.[0].number // empty')
          if [ -n "${OPEN}" ]; then
            echo "Re-vendor PR #${OPEN} is already open; leaving it alone."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `make update_model` finishes with a pre-commit run, which isn't in the uv groups.
      - name: Install pre-commit
        if: steps.open_pr.outputs.proceed == 'true'
        run: uv tool install pre-commit

      - name: Re-vendor the latest release
        if: steps.open_pr.outputs.proceed == 'true'
        run: make -C packages/linkml_runtime update_model

      # Labelled `dependencies` so it lands in the same queue as Dependabot's PRs.
      # PRs opened with GITHUB_TOKEN don't trigger CI, hence the note in the body.
      - name: Create PR with the re-vendored model
        if: steps.open_pr.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: packages/linkml_runtime/src/linkml_runtime/linkml_model
          commit-message: "Vendor linkml-model ${{ steps.pin_check.outputs.tag }}"
          title: "Vendor linkml-model ${{ steps.pin_check.outputs.tag }}"
          body: |
            Re-vendors linkml-model [${{ steps.pin_check.outputs.tag }}](https://github.com/linkml/linkml-model/releases/tag/${{ steps.pin_check.outputs.tag }}) via `make update_model`. Merging this adopts the release.

            Expect CI to fail until generated snapshots are regenerated against the new model; push those fixes to this branch.

            CI does not start on its own for bot-opened PRs: close and reopen this PR to run it.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update-vendored-linkml-model
          delete-branch: true
          labels: dependencies
