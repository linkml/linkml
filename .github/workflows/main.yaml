# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python

name: Build and test linkml
env:
  UV_VERSION: "0.12.9"
concurrency:
  # Cancel superseded runs on the same PR. github.ref is refs/pull/<n>/merge,
  # so each PR is its own group and never cancels another's runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # `uv lock --check` populates nothing, so this job has nothing worth
          # caching. Under the default (`auto`) it is also the fastest job in
          # the workflow, so it wins the race for the shared cache key with an
          # empty cache and locks every other job out of saving a real one.
          enable-cache: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.14
      - name: Check pyproject.toml and uv.lock
        run: uv lock --check
      - name: Install tox
        run: python -m pip install tox
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    needs:
      - quality-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Test on Windows with only the oldest and newest stable Python versions
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          #- os: windows-latest
          #  python-version: "3.13"
          - os: windows-latest
            python-version: "3.15"
    # See https://github.com/snok/install-poetry#running-on-windows
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}

    # 3.15 is tested against release candidates, so its failures are reported
    # without blocking a PR. Removing this is a deliberate step taken when we
    # consider 3.15 supported; the release of 3.15.0 does not lift it by itself.
    continue-on-error: ${{ matrix.python-version == '3.15' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tags if not run from main repo
        if: github.repository != 'linkml/linkml'
        run: |
          git remote add upstream https://github.com/linkml/linkml
          git fetch upstream --tags

      - name: Install uv and setup uv caching
        uses: astral-sh/setup-uv@v10.0.1
        id: setup-uv
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # setup-uv derives the cache key's Python component from `uv python
          # find`, which runs here, before setup-python, and so reports the
          # runner's system Python for every matrix entry. Without a suffix all
          # six jobs share one key and only the first to finish saves; the 3.15
          # job, which builds every dependency from source, never does.
          cache-suffix: ${{ matrix.python-version }}
          # setup-python installs from the actions/python-versions manifest,
          # which gains pre-release builds days after CPython tags them. uv's
          # python-build-standalone source carries them within a day, so uv
          # supplies the interpreter for pre-releases via UV_PYTHON.
          python-version: ${{ matrix.python-version == '3.15' && matrix.python-version || '' }}

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.python-version != '3.15'
        uses: actions/setup-python@v7.0.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      # Without an explicit interpreter, uv resolves from requires-python
      # (>=3.10) and skips pre-releases whenever another installation matches,
      # so a 3.15 job would test the runner's stable Python instead. Stable
      # versions use the interpreter setup-python installed; 3.15 uses the
      # UV_PYTHON that setup-uv exported.
      - name: Install dependencies
        env:
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --all-groups ${SETUP_PYTHON_PATH:+--python "$SETUP_PYTHON_PATH"}
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2.0.2
      - name: Test linkml package
        # Notebook tests run their own `!uv pip install` cells that mutate the
        # shared venv; they run in the isolated `test_notebooks` job instead (#3583).
        run: |
          uv run pytest tests/linkml/ --ignore=tests/linkml/test_notebooks --with-network -m "not kroki" -n auto --dist loadgroup --cov --cov-report xml:coverage-linkml.xml --cov-report term-missing
        shell: bash
      - name: Test linkml-runtime package
        # The two suites are independent, so a failure in the linkml suite should
        # not hide the state of the runtime one. The job still fails if either does.
        if: ${{ !cancelled() }}
        run: |
          uv run coverage run -m pytest tests/linkml_runtime/ --with-network -m "not kroki"
          uv run coverage xml -o coverage-linkml_runtime.xml
          uv run coverage report -m
        shell: bash
      - name: Upload linkml coverage report
        if: github.repository == 'linkml/linkml' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7.0.0
        with:
          name: codecov-linkml-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-linkml.xml
          flags: linkml
          fail_ci_if_error: true
      - name: Upload runtime coverage report
        if: github.repository == 'linkml/linkml' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7.0.0
        with:
          name: codecov-runtime-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-linkml_runtime.xml
          flags: runtime
          fail_ci_if_error: true

      # setup-uv saves under `post-if: success()`, so a failing job persists
      # nothing. 3.15 builds every dependency from source and fails on known
      # incompatibilities, so without this it repeats that build on every run.
      - name: Save uv cache from a failed job
        if: ${{ failure() && steps.setup-uv.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.setup-uv.outputs.cache-key }}

  test_slow:
    name: Slow Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    needs:
      - quality-checks
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # One cache entry per Python; see the note in the `test` job.
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Test linkml slow tests
        # Set bash shell to fail correctly on Windows https://github.com/actions/runner-images/issues/6668
        shell: bash
        run: |
          uv run coverage run -m pytest tests/linkml/ --with-slow --with-biolink -m "slow and not kroki" -n auto
          uv run coverage xml -o coverage-linkml-slow.xml
          uv run coverage report -m
      - name: Upload linkml slow test coverage
        if: github.repository == 'linkml/linkml' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7.0.0
        with:
          name: codecov-linkml-slow-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-linkml-slow.xml
          flags: linkml
          fail_ci_if_error: true

  test_notebooks:
    name: Notebook Tests
    # Notebooks execute `!uv pip install ... --upgrade` cells that mutate the
    # venv off the lock. Run them in a dedicated job with its own fresh runner
    # so they cannot pollute the primary test environment (#3581, #3583).
    # Linux only: notebook tests are skipped on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
    needs:
      - quality-checks
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # One cache entry per Python; see the note in the `test` job.
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run notebook tests
        # Run serially (no xdist): concurrent `!uv pip install` would race on the venv.
        run: |
          uv run pytest tests/linkml/test_notebooks/ --with-network -m "not kroki" --cov --cov-report xml:coverage-notebooks.xml --cov-report term-missing
      - name: Upload notebook coverage
        if: github.repository == 'linkml/linkml' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7.0.0
        with:
          name: codecov-notebooks-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-notebooks.xml
          flags: linkml
          fail_ci_if_error: true

  test_build_package:
    name: Test Build Package
    needs:
      - test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          # Should always use the same Python version as pypi-publish.yaml
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build source and wheel archives
        run: uv build --all-packages
