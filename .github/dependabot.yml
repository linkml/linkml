# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    # Wait 7 days after a release before opening an update PR, giving time for
    # malware/CVE advisories to surface (mirrors the uv `exclude-newer` cooldown).
    # Note: github-actions only supports default-days, not the semver-*-days properties.
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    # Daily refills the three open slots as they drain, rather than once a week.
    # The limit below, not the interval, is what bounds concurrent CI load.
    schedule:
      interval: "daily"
    groups:
      # Individual pull requests for major/minor updates and grouped for patch updates
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
    # Bounds rebase storms: every open PR runs the full matrix, and dependabot
    # rebases all of them when main moves.
    open-pull-requests-limit: 3
    # Wait 7 days after a release before opening an update PR, giving time for
    # malware/CVE advisories to surface (mirrors the uv `exclude-newer` cooldown).
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
