name: demo_test_suite
entries:
# JSON Schema
  reject_missing_instance:
    description: The generated JSON Schema should reject an instance with missing values
    schema: basic/model.yaml
    action:
      type: JsonSchemaGenerate
    assertion:
      type: JsonSchemaRejects
      instance: basic/invalid/missing/data.json
  accept_full_instance:
    schema: basic/model.yaml
    description: The generated JSON Schema should accept a valid instance with optional values filled
    action:
      type: JsonSchemaGenerate
    assertion:
      type: JsonSchemaAccepts
      instance: basic/valid/full/data.json
  include_description:
    schema: basic/model.yaml
    description: >-
      The generated JSON Schema should contain the schema metadata description for the class in JSON Schema $defs.
    action:
      type: JsonSchemaGenerate
    assertion:
      type: JsonPointerAssertion
      path: $defs/SomeClass/description
      value: Some text that describes the class

# Rank derivation

# # Issue #3845
#  zero_rank_preserved:
