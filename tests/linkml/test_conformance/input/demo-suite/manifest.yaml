#    action:
#      type: DeriveAction
#    assertion:
#      type: JsonPointerAssertion
#      path: classes/SomeClass/attributes/zero_rank_slot/rank
#      value: 0

  class_to_class_rank_inherited:
    schema: rank/class2class.yaml
    description: The derivation procedure should propagate rank to class children
    action:
      type: DeriveAction
    assertion:
      type: JsonPointerAssertion
      path: classes/SomeClass/attributes/second_slot/rank
      value: 2

  slot_to_class_rank_set:
    schema: rank/slot2class.yaml
    description: The derivation procedure should use the provided slot_usage rank
    action:
      type: DeriveAction
    assertion:
      type: JsonPointerAssertion
      path: classes/SomeClass/attributes/second_slot/rank
      value: 2

