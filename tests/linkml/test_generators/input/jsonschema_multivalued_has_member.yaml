schema:
  id: http://example.org/jsonschema_multivalued_has_member
  name: jsonschema_multivalued_has_member

  imports:
    - https://w3id.org/linkml/types

  slots:
    int_list_with_has_member:
      range: integer
      multivalued: true
      has_member:
        minimum_value: 2
        maximum_value: 5

    string_list_with_has_member:
      range: string
      multivalued: true
      has_member:
        pattern: e.*

  classes:
    Test:
      tree_root: true
      slots:
        - int_list_with_has_member
        - string_list_with_has_member
json_schema:
  properties:
    int_list_with_has_member:
      contains:
        minimum: 2
        maximum: 5
      type: array
    string_list_with_has_member:
      contains:
        pattern: e.*
      type: array
  required:
    - int_list_with_has_member
    - string_list_with_has_member
data_cases:
  - data:
      int_list_with_has_member: [2, 3, 4, 5]
      string_list_with_has_member: [echo]
  - data:
      int_list_with_has_member: [0, 1, 2]
      string_list_with_has_member: [echo]
  - data:
      int_list_with_has_member: [6, 7, 8]
      string_list_with_has_member: [echo]
    error_message: Failed validating 'contains'
  - data:
      int_list_with_has_member: [2]
      string_list_with_has_member:
        - echo
        - elephant
  - data:
      int_list_with_has_member: [2]
      string_list_with_has_member:
        - echo
        - foxtrot
  - data:
      int_list_with_has_member: [2]
      string_list_with_has_member:
        - foxtrot
        - golf
    error_message: Failed validating 'contains'
  # a member is a value, so a list without a value has no member
  - data:
      int_list_with_has_member: []
      string_list_with_has_member: [echo]
    error_message: Failed validating 'contains'
  - data:
      int_list_with_has_member: null
      string_list_with_has_member: [echo]
    error_message: Failed validating 'type'
  - data:
      string_list_with_has_member: [echo]
    error_message: Failed validating 'required'
