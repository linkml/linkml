schema:
  id: http://example.org/jsonschema_multivalued_element_constraints
  name: jsonschema_multivalued_element_constraints

  imports:
    - https://w3id.org/linkml/types

  slots:
    int_list:
      range: integer
      multivalued: true
      minimum_value: 2
      maximum_value: 5

    string_list:
      range: string
      multivalued: true
      pattern: e.*

    int_list_with_all_members:
      range: integer
      multivalued: true
      all_members:
        minimum_value: 2
        maximum_value: 5

    string_list_with_all_members:
      range: string
      multivalued: true
      all_members:
        pattern: e.*

  classes:
    Test:
      tree_root: true
      slots:
        - int_list
        - string_list
        - int_list_with_all_members
        - string_list_with_all_members
json_schema:
  properties:
    int_list:
      items:
        minimum: 2
        maximum: 5
      type: array
    string_list:
      items:
        pattern: e.*
      type: array
    int_list_with_all_members:
      items:
        minimum: 2
        maximum: 5
      type: array
    string_list_with_all_members:
      items:
        pattern: e.*
      type: array
data_cases:
  - data:
      int_list: [2, 3, 4, 5]
  - data:
      int_list: [1, 2, 3]
    error_message: Failed validating 'minimum'
  - data:
      int_list: [4, 5, 6]
    error_message: Failed validating 'maximum'
  - data:
      string_list:
        - echo
        - elephant
  - data:
      string_list:
        - echo
        - foxtrot
    error_message: Failed validating 'pattern'
  - data:
      int_list_with_all_members: [2, 3, 4, 5]
  - data:
      int_list_with_all_members: [1, 2, 3]
    error_message: Failed validating 'minimum'
  - data:
      string_list_with_all_members:
        - echo
        - elephant
  - data:
      string_list_with_all_members:
        - echo
        - foxtrot
    error_message: Failed validating 'pattern'
