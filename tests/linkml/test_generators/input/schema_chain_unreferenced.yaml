# LinkML schema with a chain of unreferenced classes
id: https://w3id.org/linkml/tests/chain_unreferenced
name: chain_unreferenced
default_prefix: chain_unreferenced
imports:
  - linkml:types

classes:
  Foo:
    description: the only class reachable from the endpoint
    attributes:
      name:
        range: string

  Baz:
    description: unrelated class, not reachable from Foo, but present in the schema
    attributes:
      bar_ref:
        range: Bar

  Bar:
    description: should be pruned - only referenced by the also-unreachable Baz
    attributes:
      value:
        range: string
