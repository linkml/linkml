# LinkML schema mixing an unreferenced chain with an unrelated class
id: https://w3id.org/linkml/tests/unreferenced_with_unrelated
name: unreferenced_with_unrelated
default_prefix: unreferenced_with_unrelated
imports:
  - linkml:types

classes:
  Foo:
    description: the only class reachable from the endpoint
    attributes:
      name:
        range: string

  Foo Bar:
    description: unrelated class with a space in its name, not reachable from Foo, but present in the schema
    attributes:
      bar_ref:
        range: Baz Qux

  Baz Qux:
    description: should be pruned - only referenced by the also-unreachable Foo Bar
    attributes:
      value:
        range: string

  Unrelated:
    description: completely unrelated class, neither referenced by the endpoint nor by any template-declared class
    attributes:
      value:
        range: string
