openapi: 3.0.3
info:
  title: Multiple Dangling References Test
  version: '1.0.0'
servers:
  - url: https://example.org/
security:
  - PayloadSignature: []
paths:
  /api/person:
    get:
      security:
        - PayloadSignature: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
  /api/foo:
    get:
      security:
        - PayloadSignature: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foo'
  /api/bar:
    get:
      security:
        - PayloadSignature: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bar'
components:
  schemas:
    Person:
      type: object
      x-linkml-schema: https://w3id.org/linkml/tests/kitchen_sink
      x-linkml-source: Person
    Foo:
      type: object
      x-linkml-schema: https://w3id.org/linkml/tests/kitchen_sink
      x-linkml-source: NonExistentClassFoo
    Bar:
      type: object
      x-linkml-schema: https://w3id.org/linkml/tests/kitchen_sink
      x-linkml-source: NonExistentClassBar
